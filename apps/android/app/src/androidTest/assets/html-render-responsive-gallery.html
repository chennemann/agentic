<div id="slides" data-t3-gallery><figure ><img src="data:image/png;base64,__TEST_IMAGE__" alt="01-sign-in.png"  draggable="false"><figcaption><strong>01 — Organization setup: sign in</strong><p>First screen for an administrator setting up an organization.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="02-administrator.png" loading="lazy" draggable="false"><figcaption><strong>02 — Administrator access verified</strong><p>The wizard checks organization access before shared settings can be changed.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="03-test-services.png" loading="lazy" draggable="false"><figcaption><strong>03 — Test service settings</strong><p>Eureka has shared credentials. Keycloak and DUSE have base URLs; each member supplies their own credentials.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="04-prod-services.png" loading="lazy" draggable="false"><figcaption><strong>04 — Prod service settings</strong><p>Eureka has shared credentials. Keycloak and DUSE have base URLs; each member supplies their own credentials.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="05-services-empty.png" loading="lazy" draggable="false"><figcaption><strong>05 — Add the organization’s first service</strong><p>Services collect application discovery, API documentation, and database settings.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="06-service-form.png" loading="lazy" draggable="false"><figcaption><strong>06 — Service configuration form</strong><p>The administrator sets the Eureka application name, OpenAPI path, and optional Test/Prod databases.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="07-service-published.png" loading="lazy" draggable="false"><figcaption><strong>07 — Service published</strong><p>The service is saved as organization configuration.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="08-member-access.png" loading="lazy" draggable="false"><figcaption><strong>08 — Member access</strong><p>The administrator creates a member role and chooses whether it includes production access.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="09-finish.png" loading="lazy" draggable="false"><figcaption><strong>09 — Setup summary and handoff</strong><p>The final screen explains what members need to do and offers the first sync.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="10-workspace.png" loading="lazy" draggable="false"><figcaption><strong>10 — Service in the workspace</strong><p>The synced service appears as a project with its environments, database connection, and imported endpoint.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="11-api-ready.png" loading="lazy" draggable="false"><figcaption><strong>11 — Services: stale sign-in prompt</strong><p>Observed during this capture: opening Services first showed a sign-in prompt despite an active session. Retry loaded the service correctly.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="12-api-loaded.png" loading="lazy" draggable="false"><figcaption><strong>12 — API loading succeeded</strong><p>After Retry, the card shows the resolved GET URL, HTTP 200, and imported endpoint count.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="13-api-error.png" loading="lazy" draggable="false"><figcaption><strong>13 — API loading failed</strong><p>A failed load shows the attempted URL and HTTP error. Existing imported requests remain available.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="14-service-edit.png" loading="lazy" draggable="false"><figcaption><strong>14 — Edit an existing service</strong><p>The same form lets an administrator update an existing organization service.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="15-remove-service.png" loading="lazy" draggable="false"><figcaption><strong>15 — Remove an organization service</strong><p>Confirmation explains that shared configuration is removed for all members; upstream applications and database data remain.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="16-local-project.png" loading="lazy" draggable="false"><figcaption><strong>16 — A local project in the workspace</strong><p>Local projects show a trash button beside the project name.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="17-delete-local.png" loading="lazy" draggable="false"><figcaption><strong>17 — Delete a local project</strong><p>The confirmation lists the local connections, requests, and environments that will be deleted.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="18-local-deleted.png" loading="lazy" draggable="false"><figcaption><strong>18 — Local project deleted</strong><p>The local project and its tabs are removed; the organization service remains.</p></figcaption></figure><figure hidden><img src="data:image/png;base64,__TEST_IMAGE__" alt="19-personal-credentials.png" loading="lazy" draggable="false"><figcaption><strong>19 — Members' personal credentials</strong><p>Each member enters their own Keycloak and DUSE username and password in TEST services, and similarly in PROD services.</p></figcaption></figure></div>
