name: CI Verify

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Build Node workspaces
        run: npm run build

      - name: Check Node workspaces
        run: npm run check

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare opencode submodule (sparse)
        run: sh script/setup-opencode-submodule.sh

      - name: Make Android Gradle wrapper executable
        run: chmod +x ./apps/android/gradlew

      - name: Run Android ktlint checks
        run: ./apps/android/gradlew --parallel -p apps/android ktlintCheck

      - name: Run Android build and tests
        run: ./apps/android/gradlew --parallel -p apps/android build
